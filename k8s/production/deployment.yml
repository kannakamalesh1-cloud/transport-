---
apiVersion: v1
kind: Namespace
metadata:
  name: production

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transport-app
  namespace: production
  labels:
    app: transport
    env: production
spec:
  replicas: 2                          # ← Production: 2 replicas for HA
  selector:
    matchLabels:
      app: transport
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: transport
        env: production
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: transport
          image: ghcr.io/kannakamalesh1-cloud/transport-:production-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
          envFrom:
            - secretRef:
                name: transport-secrets-production
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: transport-service
  namespace: production
spec:
  selector:
    app: transport
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: transport-ingress
  namespace: production
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: transport.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: transport-service
                port:
                  number: 80
